name: Build BlueLink APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Flutter project
        run: flutter create --org com.bluelink --project-name bluelink --platforms=android,ios app

      - name: Copy sources
        run: |
          cp app_pubspec.yaml app/pubspec.yaml
          cp main.dart app/lib/main.dart
          mkdir -p app/assets
          cp icon.png send.png receive.png files.png app/assets/
          mkdir -p app/android/app/src/main/kotlin/com/bluelink/bluelink
          cp MainActivity.kt app/android/app/src/main/kotlin/com/bluelink/bluelink/MainActivity.kt

      - name: Patch Android manifest
        run: |
          M=app/android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="bluelink"/android:label="BlueLink"/' $M
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' $M
          for p in INTERNET CAMERA ACCESS_WIFI_STATE ACCESS_NETWORK_STATE REQUEST_INSTALL_PACKAGES QUERY_ALL_PACKAGES; do
            sed -i "0,/<application/s//<uses-permission android:name=\"android.permission.$p\"\/>\n    <application/" $M
          done
          cat $M

      - name: Build
        working-directory: app
        run: |
          flutter pub get
          dart run flutter_launcher_icons
          flutter build apk --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlueLink-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: BlueLink ${{ github.run_number }}
          files: app/build/app/outputs/flutter-apk/app-release.apk
